{% extends "base.html" %}

{% block title %}Upload Dataset{% endblock %}

{% block content %}

<div class="upload-container">

    <h1>📂 Upload Dataset</h1>

    <p>
        Upload a CSV file containing the 40 input features for phishing prediction.
    </p>

    <form action="/upload" method="POST" enctype="multipart/form-data">

        <input
            type="file"
            name="file"
            accept=".csv"
            required
        >

        <br><br>

        <button type="submit">
            Upload & Predict
        </button>

    </form>

</div>

{% endblock %}
